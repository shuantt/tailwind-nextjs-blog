name: Quality

on:
  pull_request:
  push:
    branches-ignore: main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
      - run: yarn install --immutable
      - run: yarn check
      - run: yarn guestbook:test
      - run: yarn hero:test
      - run: yarn build
  artalk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - run: node services/artalk/build.mjs --test
      - run: node services/artalk/build.mjs
      - run: node scripts/artalk-smoke.mjs

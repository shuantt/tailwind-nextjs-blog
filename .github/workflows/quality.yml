name: Quality

on:
  pull_request:
  push:
    branches-ignore: main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
      - run: yarn install --immutable
      - run: yarn check
      - run: yarn build
        env:
          EXPORT: 1
          UNOPTIMIZED: 1
